# Tool versions and project tasks. `mise install` once, then `mise run <task>`.
# Machine-specific settings (e.g. SITES_ROOT) go in mise.local.toml, which is gitignored.

[tools]
dotnet = "10.0.403"
node = "24"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.spike]
description = "Run the Roslyn feasibility spike against samples/"
run = "dotnet run --project spike"

[tasks.scan]
description = "Read-only inventory of the Web Site projects under $SITES_ROOT; writes .scan/report.{md,json}"
run = "dotnet run scripts/scan-sites.cs --"

[tasks."ext:install-deps"]
description = "Install the extension's npm dev dependencies"
dir = "extension"
run = "npm install"

[tasks."ext:test"]
description = "Run the extension tests (navigation and diagnostics unit tests, grammar tests, manifest check)"
dir = "extension"
run = "npm test"

[tasks."ext:package"]
description = "Build the extension .vsix (including the language server) into extension/dist/"
depends = ["server:build"]
dir = "extension"
run = "npm run package"

[tasks."server:build"]
description = "Publish the language server (portable .dll; the extension gets a .NET runtime from the .NET Install Tool) into extension/server/"
run = "rm -rf extension/server && dotnet publish server/AspxVb.Server -c Release -p:UseAppHost=false -o extension/server"

[tasks."server:test"]
description = "Run the language server tests (against samples/)"
run = "dotnet test server/AspxVb.Server.Tests"

[tasks."server:check"]
description = "Compile every page of every site under $SITES_ROOT (read-only) and summarize diagnostics"
run = "dotnet run --project server/AspxVb.Server -c Release -- --check \"$SITES_ROOT\""

[tasks."ext:smoke"]
description = "Run grammar and navigation over every real site under $SITES_ROOT (read-only) and report breakage"
dir = "extension"
run = [
  "node test/smoke-real-files.mjs \"$SITES_ROOT\"",
  "npm run compile --silent && node out/test/smoke-navigation.js \"$SITES_ROOT\"",
]
